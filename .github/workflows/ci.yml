name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python lint.py

  gru:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gru
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gru/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run mutation
      - name: Demo episode must close PASS
        run: node src/cli.ts demo --json
